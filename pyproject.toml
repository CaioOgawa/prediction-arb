[project]
name = "prediction-arb"
version = "0.1.0"
description = "Sistema quantitativo end-to-end para Polymarket"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    # APIs Polymarket
    "py-clob-client>=0.18.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    # Auth e env
    "python-dotenv>=1.0.0",
    "eth-account>=0.10.0",
    # Storage
    "pyarrow>=14.0.0",
    "fastparquet>=2023.10.0",
    # ML — usado pelo ml_lab (congelado, ADR-008) e pela aba "ML / Modelo" do
    # dashboard, que faz unpickle de um bundle scikit-learn/xgboost/lightgbm
    # sem importar essas libs diretamente — não dá pra mover pra um extra
    # sem quebrar essa aba a cada `uv sync` (verificado: tentado e revertido
    # nesta sessão, P2-44).
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    # Visualização
    "streamlit>=1.35.0",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    # Utilitários
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
# Deep learning — instale separadamente quando chegar na Fase 3
dl = [
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "stable-baselines3>=2.2.0",
    "gymnasium>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.4.0",
    "anyio>=4.0.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["ml_lab", "graphify-out"]

[tool.ruff.lint]
# P2-43: primeira config de lint num código que nunca viu um linter — começa
# enxuto (correção óbvia + imports) pra não afogar o commit que introduz isso
# num diff de milhares de linhas. Alargar depois que o baseline estiver limpo.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line-length já cobre isso; muita linha de tabela/dict passa de 110
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["ml_lab", "graphify-out"]
# execution/paper_trader.py existe tanto como `paper_trader` (via sys.path.insert,
# P2-45) quanto como `execution.paper_trader` — sem isso mypy recusa rodar
# ("Source file found twice under different module names").
explicit_package_bases = true
# P2-43: mesmo raciocínio do ruff — não travar em strict num código nunca
# checado. Frouxo agora, aperta módulo por módulo depois.
check_untyped_defs = false
disallow_untyped_defs = false
