name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.2"

      - name: Set up Python
        run: uv python install 3.11

      - name: Instala dependências (lock exato, com o grupo dev)
        run: uv sync --locked --group dev

      - name: Testes (sem integration — sem rede)
        run: uv run pytest

      # P2-43: primeira config de ruff/mypy num código que nunca viu linter —
      # 125 achados de ruff e 29 de mypy no baseline desta sessão (conferir
      # `uv run ruff check . --statistics` / `uv run mypy .` localmente).
      # Não-bloqueantes até o baseline ser limpo módulo por módulo; tirar o
      # continue-on-error de cada um assim que sair limpo.
      - name: ruff (não-bloqueante até o baseline ser limpo)
        run: uv run ruff check .
        continue-on-error: true

      - name: mypy (não-bloqueante até o baseline ser limpo)
        run: uv run mypy .
        continue-on-error: true
